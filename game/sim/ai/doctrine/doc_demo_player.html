<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctrine Replay</title>
<style>
:root{--bg:#14171a;--fg:#e8e6e1;--mut:#9aa0a6;--card:#1d2227;--acc:#f2c94c}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 12px}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media(max-width:820px){#wrap{grid-template-columns:1fr}}
canvas{width:100%;height:auto;border-radius:8px;background:#000;display:block}
.card{background:var(--card);border-radius:8px;padding:10px}
#cap{min-height:3.2em;margin-top:8px}#cap b{color:var(--acc)}
#log{max-height:520px;overflow:auto;font-size:12.5px}#log div{padding:4px 6px;border-radius:4px;cursor:pointer}
#log div.on{background:#2c343b}#log span{color:var(--acc)}
.ctl{display:flex;gap:8px;align-items:center;margin-top:8px}.ctl input{flex:1}
button{background:#2c343b;color:var(--fg);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:12.5px;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style></head><body><main>
<h1>Doctrine replay: a company assaults high ground</h1>
<p class="sub">AI side driven only by the G6 doctrine engine (CONTRACTS_G6 §16). Recorded from the deterministic sim; every caption is an AiDecision the AI emitted.</p>
<div id="wrap"><div><canvas id="cv"></canvas>
<div class="ctl"><button id="pp">Pause</button><input id="sl" type="range" min="0" value="0"><span id="tk"></span></div>
<div id="cap" class="card"></div>
<div class="leg"><span><i style="background:#4080ff"></i>base of fire / overwatch</span><span><i style="background:#33d94d"></i>assault</span><span><i style="background:#ff9a1a"></i>flank</span><span><i style="background:#fff"></i>captain</span><span><i style="background:#f22626"></i>enemy</span><span><i style="background:#f2e64c"></i>phase line</span><span><i style="background:#9e6b40"></i>hill (darker = higher)</span></div>
</div><div id="log" class="card"></div></div>
</main><script>
const R=/*REPLAY*/null;
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),S=14;
const [X0,Y0,W,H]=R.crop;cv.width=W*S;cv.height=H*S;
const LV=['#4d6b4d','#6b8c61','#8c804d','#9e6b40'],RC=['#4080ff','#33d94d','#ff9a1a','#ffffff','#f22626'];
const sl=document.getElementById('sl');sl.max=R.samples.length-1;let i=0,play=true;
function draw(){const s=R.samples[i];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){cx.fillStyle=LV[+R.height[y][x]];cx.fillRect(x*S,y*S,S,S);}
 cx.fillStyle='#f2e64c';for(const p of s.lines){cx.fillRect((p[0]-X0)*S-1,(p[1]-Y0)*S-18,3,36);}
 for(const u of s.u){const x=(u[2]/10-X0)*S,y=(u[3]/10-Y0)*S;if(x<0||y<0||x>W*S||y>H*S)continue;
  cx.beginPath();cx.arc(x,y,5,0,7);cx.fillStyle=RC[u[1]];cx.fill();cx.lineWidth=1.5;cx.strokeStyle='#000';cx.stroke();}
 let last=null;for(const d of R.decisions){if(d.t<=s.t)last=d;}
 document.getElementById('tk').textContent='t='+s.t+' ('+(s.t/20).toFixed(1)+' s) phase: '+(s.phase||'-');
 document.getElementById('cap').innerHTML=last?('<b>'+last.tag+'</b> t='+last.t+'<br>'+last.reason):'Company forming up.';
 document.querySelectorAll('#log div').forEach(e=>e.classList.toggle('on',last&&+e.dataset.t===last.t&&e.dataset.g===last.tag));
 sl.value=i;}
const log=document.getElementById('log');
for(const d of R.decisions){const e=document.createElement('div');e.dataset.t=d.t;e.dataset.g=d.tag;
 e.innerHTML='<span>'+d.tag+'</span> t='+d.t+'<br>'+d.reason;e.onclick=()=>{i=R.samples.findIndex(s=>s.t>=d.t);if(i<0)i=0;draw();};log.appendChild(e);}
sl.oninput=()=>{i=+sl.value;draw();};
document.getElementById('pp').onclick=e=>{play=!play;e.target.textContent=play?'Pause':'Play';};
setInterval(()=>{if(play){i=(i+1)%R.samples.length;draw();}},120);draw();
</script></body></html>
