[package]
name = "rts_core"
version = "0.5.1"
edition = "2021"
publish = false
description = "Native sim core for RTS: Age of Modern War (spatial hash, nav, steering). CONTRACTS_G3b section 5."

[lib]
crate-type = ["cdylib"]

[dependencies]
# GDExtension is forward compatible: built against the 4.7 API, loads in Godot 4.7.x.
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7", "experimental-threads"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
